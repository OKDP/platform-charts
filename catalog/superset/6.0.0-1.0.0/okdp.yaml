# OKDP's part of superset: the platform values it needs, OKDP's defaults of
# the Apache Superset chart and what an instance may override; then the
# mapping besides the chart's values (values.cel.yaml): its OAuth client (the
# former module oidc-dcr), OKDP's own objects (the env Secrets, the Valkey
# cache, the generated Secrets) and what the instance publishes.
# ${{ ... }} is a CEL expression; the {{ ... }} template code meant for the
# Superset chart's tpl and the shell's $VAR stay literal.
#
# The former module rendered OKDP's superset chart
# (quay.io/okdp/charts/superset 0.15.2-2.0), a wrapper around the Apache chart
# with its own env Secrets and Python config overrides. That wrapper is folded
# in here: its defaults are part of the superset values (fixed ones in
# superset.defaults.yaml), its env Secrets are objects below (same names and
# keys, read by the Python config and the init containers).

roles: [dataviz]
dependsOn: [database-server, ingress]
require:
  - ingress.suffix
  - ingress.className
  - certificateIssuers.selfSigned.name
  - oidc.issuerUri
defaults:
  superset: superset.defaults.yaml
upstream:
  superset:
    # What the platform relies on: the names (fullnameOverride, the env and
    # config Secrets the pods read), the configOverrides blocks carrying OIDC
    # sign-in, the Trino OAuth2, the Valkey password, the examples and the
    # proxy fix the redirect_uri depends on, the metadata database (its URI is
    # built from the DB_* env of the env Secrets) and the cache connection to
    # the Valkey of the objects below (the bundled postgresql and redis charts
    # are off: redis reads its previous password with lookup), the local admin
    # creation (createAdmin writes the password into the init script; the
    # mapping creates it from a Secret), forceReload (a randAlphaNum pod
    # annotation, a new value at each render: Flux and Argo CD would never
    # agree, kept false), configOverridesFiles (their .Files.Get paths would
    # resolve outside the chart) and the ingress host registered with the
    # identity provider. configOverrides is Python appended to
    # superset_config.py: an instance may add blocks, which run after the
    # platform's and can redefine any setting; the protection keeps the
    # platform's blocks in place, it is no sandbox.
    # extraConfigs.import_datasources.yaml follows `datasources` unless an
    # instance replaces it: deliberately not protected (it could be, as
    # extraConfigs["import_datasources.yaml"]), as in okdp-lib-chart.
    protect: [fullnameOverride, envFromSecret, configFromSecret,
              configOverrides.auth_registration, configOverrides.oauth_enabled,
              configOverrides.trino_oauth_enabled, configOverrides.custom_sso_security_manager,
              configOverrides.extra_config, configOverrides.load_examples,
              configOverrides.valkey_password, configOverridesFiles,
              config.resultsBackend, database.uri, database.driver,
              cache.enabled, cache.host, cache.port, cache.user, cache.password,
              cache.cacheUrl, cache.celeryUrl, cache.cacheDb, cache.celeryDb,
              postgresql, redis, init.createAdmin, init.adminUser, init.command,
              supersetNode.forceReload, supersetWorker.forceReload,
              supersetCeleryBeat.forceReload, supersetMcp.forceReload,
              ingress.enabled, ingress.ingressClassName, ingress.hosts, ingress.tls]
    # The lists carrying the platform's env Secrets, credentials, CA bundle and
    # wait init containers: an instance adds to them.
    append: [envFromSecrets, extraEnvRaw, extraVolumes, extraVolumeMounts,
             init.initContainers, supersetNode.initContainers, supersetWorker.initContainers]

vars:
  host: superset-${{ release.namespace }}.${{ global.okdp.ingress.suffix }}
  # Generated secret: superset_secret_key and redis-password (the Valkey password).
  internalSecret: ${{ release.name }}-internal
  # Generated secret of the local admin (key password), only without OIDC.
  adminSecret: ${{ release.name }}-admin
  # The Valkey cache and Celery broker, named redis as the env it is read from.
  redis: ${{ release.name }}-redis
  oidcBaseUrl: ${{ global.okdp.oidc.issuerUri }}/protocol/openid-connect
  # dcr mode: one client for the sign-in and the Trino datasources (both
  # redirect URIs).
  trinoOauthSecret: >-
    ${{ platform.oidc.dcr.enabled ? platform.oidcClientSecret : 'creds-' + release.name + '-oauth2-trino' }}
  insecureSkipVerify: ${{ platform.oidc.?insecureSkipVerify.orValue(false) }}
  # Parameters a values layer may set to null (Helm's `| default`).
  locale: ${{ str(values.?locale.orValue('')) }}
  currency: ${{ str(values.?currency.orValue('')) }}
  d3Format: ${{ values.?d3Format.orValue({}) }}
  d3TimeFormat: ${{ values.?d3TimeFormat.orValue({}) }}
  oidcRoleMapping: ${{ values.?oidcRoleMapping.orValue({}) }}
  datasources: ${{ values.?datasources.orValue([]) }}

  # AUTH_ROLES_MAPPING of superset_config.py: one line per OIDC group (sorted),
  # the group quoted, its Superset roles as JSON.
  rolesMapping: >-
    ${{ oidcRoleMapping.map(k, k).sort().map(k, '  ' + quote(k) + ': ' + toJson(oidcRoleMapping[k]) + ',') }}

  # The Trino datasources, one Superset database per item (its connection
  # resolved: its uri). Items without a connection are left to errors.
  datasourceItems:
    - $for: d in datasources.filter(d, type(d.?trino.orValue('')) == map)
      $each: |-
        - database_name: ${{ quote(d.name) }}
          sqlalchemy_uri: ${{ quote(d.trino.uri + '/' + d.catalog) }}
          impersonate_user: true
          extra: |
            {
              "engine_params": {},
              "metadata_params": {},
              "connect_args": {
                "http_scheme": "https",
                "verify": ${{ str(!insecureSkipVerify) }}
              },
              "metadata_cache_timeout": {},
              "schemas_allowed_for_file_upload": []
            }
          allow_run_async: true
          allow_dml: true
          allow_ctas: true
          allow_cvas: true
          expose_in_sqllab: true
          tables: []

  # The script of the wait-for-databases init container of the init Job:
  # connection fields come through the environment, the script expands
  # nothing that comes from the values.
  waitDatabases:
    - |
      until PGPASSWORD="$META_PW" psql -h "$META_HOST" -p "$META_PORT" -U "$META_USER" -d "$META_DB" -c '\q' 2>/dev/null; do
        echo "waiting for database $META_DB"; sleep 3
      done
    - $for: "x in (values.load_examples ? [true] : [])"
      $each: |
        until PGPASSWORD="$EX_PW" psql -h "$EX_HOST" -p "$EX_PORT" -U "$EX_USER" -d "$EX_DB" -c '\q' 2>/dev/null; do
          echo "waiting for database $EX_DB"; sleep 3
        done
    - |
      echo "databases reachable"

  # The wait init containers of the Superset pods: the Apache default, reading
  # the database (and cache) host and port from the env Secrets. Their image is
  # template code for the upstream chart, which passes initContainers to tpl:
  # the Superset image.
  waitFor: |
    SECONDS=0
    wait_for() {
      local host=$1 port=$2 name=$3
      until (exec 3<>/dev/tcp/"$host"/"$port") 2>/dev/null; do
        if [ "$SECONDS" -ge 120 ]; then
          echo "timeout waiting for $name at $host:$port after 120s" >&2
          exit 1
        fi
        echo "waiting for $name at $host:$port (elapsed ${SECONDS}s)"
        sleep 2
      done
      echo "$name at $host:$port is up"
    }
    wait_for "$DB_HOST" "$DB_PORT" postgres
  waitContainers:
    $for: name in ['wait-for-postgres-redis', 'wait-for-postgres']
    $vars:
      redisToo: ${{ name == 'wait-for-postgres-redis' }}
    $key: ${{ name }}
    $value:
      name: ${{ name }}
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      envFrom:
        - secretRef:
            name: ${{ release.name }}-db-env
        - $if: ${{ redisToo }}
          secretRef:
            name: ${{ release.name }}-redis-env
      command:
        - /bin/bash
        - -c
        - >-
          ${{ waitFor + (redisToo ? 'wait_for "$REDIS_HOST" "$REDIS_PORT" redis\n' : '') }}
      resources:
        limits:
          memory: "256Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"

  # The generated Secrets (objects) are kept when the release goes away (Helm
  # keep, Argo CD Delete=false) and adopted again by the next install.
  keep:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false

errors:
  # The metadata database is required, and Superset reads its credentials
  # from the connection's Secret.
  - $if: ${{ type(values.metadataDb) != map }}
    $value: "superset: metadataDb: no database-server connection given"
  - $if: ${{ type(values.metadataDb) == map && !has(values.metadataDb.secretRef) }}
    $value: 'superset: metadataDb: connection "${{ values.metadataDb.okdp.ref }}" has no secretRef: Superset needs a Secret with the keys username and password'
  - $if: ${{ values.load_examples && type(values.examplesDb) != map }}
    $value: "superset: examplesDb: no database-server connection given"
  - $if: ${{ values.load_examples && type(values.examplesDb) == map && !has(values.examplesDb.secretRef) }}
    $value: 'superset: examplesDb: connection "${{ values.examplesDb.okdp.ref }}" has no secretRef: the examples loader needs a Secret with the keys username and password'
  - $for: "i in lists.range(datasources.size())"
    $each:
      $if: ${{ type(datasources[i].?trino.orValue('')) != map }}
      $value: "superset: datasources[${{ i }}].trino: no trino connection given"

# The OAuth client (the former module oidc-dcr), registered by dynamic client
# registration in dcr mode (global.okdp.oidc.clientProvisioning: dcr): the
# compiler adds the chart oidc-dcr (Job <release>-oidc-dcr), which writes the
# Secret platform.oidcClientSecret (<release>-<namespace>-dcr). Nothing in
# existing mode.
oidcClients:
  # One client for the sign-in and the Trino datasources.
  - redirectUris:
      - https://${{ host }}/oauth-authorized/${{ first([platform.oidc.?displayName.orValue(''), 'keycloak']) }}
      - https://${{ host }}/api/v1/database/oauth2/
    grantTypes: [authorization_code, refresh_token]

# OKDP's own objects, rendered by the umbrella (okdp.objects.yaml).
objects:
  # The env Secrets the Superset pods load (envFromSecret, envFromSecrets)
  # and the Python config reads, formerly rendered by OKDP's wrapper chart
  # (quay.io/okdp/charts/superset) from its `okdp:` values: <release>-db-env,
  # -oauth2-env, -redis-env, -superset-env, -trino-oauth2-env. No
  # credential: those are secretKeyRefs (extraEnvRaw).
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${{ release.name }}-db-env
      labels: ${{ labels }}
    type: Opaque
    stringData:
      DB_HOST: ${{ str(values.metadataDb.host) }}
      DB_PORT: ${{ str(values.metadataDb.port) }}
      DB_NAME: ${{ str(values.metadataDb.dbName) }}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${{ release.name }}-oauth2-env
      labels: ${{ labels }}
    type: Opaque
    stringData:
      AUTH_OAUTH_ENABLED: ${{ str(platform.oidc.enabled) }}
      # AUTH_OAUTH_SSL_CERTIFICATE_VERIFY: verified against
      # REQUESTS_CA_BUNDLE (certs-bundle, mounted at /cacerts).
      $merge: >-
        ${{ !platform.oidc.enabled ? {} : {
          'AUTH_OAUTH_BASE_URL': oidcBaseUrl,
          'AUTH_OAUTH_PROVIDER': first([platform.oidc.?displayName.orValue(''), 'keycloak']),
          'AUTH_OAUTH_SCOPE': platform.oidc.scope,
          'AUTH_OAUTH_SSL_CERTIFICATE_VERIFY': insecureSkipVerify ? 'false' : 'true',
          'AUTH_OAUTH_USE_PKCE': platform.oidc.?usePKCE.orValue(true) ? 'S256' : 'None',
          'SUPERSET_DOMAIN': host
        } }}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${{ release.name }}-redis-env
      labels: ${{ labels }}
    type: Opaque
    stringData:
      REDIS_HOST: ${{ redis }}
      REDIS_PORT: "6379"
      REDIS_PROTO: "redis"
      REDIS_DB: "1"
      REDIS_CELERY_DB: "0"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${{ release.name }}-superset-env
      labels: ${{ labels }}
    type: Opaque
    stringData:
      SUPERSET_LOAD_EXAMPLES: ${{ str(values.load_examples) }}
      # The examples loader is postgresql specific (psycopg2 dialect, main search_path).
      $merge: >-
        ${{ !values.load_examples ? {} : {
          'SQLALCHEMY_EXAMPLES_URI': 'postgresql+psycopg2://$DB_EXAMPLES_USER:$DB_EXAMPLES_PASS@' + str(values.examplesDb.host)
            + ':' + str(values.examplesDb.port) + '/' + str(values.examplesDb.dbName) + '?options=-csearch_path%3Dmain'
        } }}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${{ release.name }}-trino-oauth2-env
      labels: ${{ labels }}
    type: Opaque
    stringData:
      TRINO_OAUTH_ENABLED: ${{ str(platform.oidc.enabled) }}
      $merge: >-
        ${{ !platform.oidc.enabled ? {} : {
          'TRINO_AUTH_OAUTH_BASE_URL': oidcBaseUrl,
          'TRINO_OAUTH_SCOPE': platform.oidc.scope,
          'SUPERSET_DOMAIN': host
        } }}

  # Valkey: Superset's cache and Celery broker (the Valkey project image
  # valkey/valkey, BSD-3-Clause). Replaces the bitnami redis chart the
  # Superset chart bundles (a standalone master, the only use made of it):
  # that chart reads its previous password with `lookup`, and the bitnami
  # images it pins are no longer published. The Service keeps the name
  # <release>-redis and the pods read it from the REDIS_* env (the
  # redis-env Secret). No persistence: the cache and the Celery queue are
  # rebuilt after a restart.
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${{ redis }}
      labels: ${{ okdpLabels('redis') }}
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels: ${{ okdpSelectorLabels('redis') }}
      template:
        metadata:
          labels: ${{ okdpLabels('redis') }}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: valkey
              image: docker.io/valkey/valkey:9.1.2-alpine
              imagePullPolicy: IfNotPresent
              command:
                - valkey-server
                - --requirepass
                - $(REDIS_PASSWORD)
                - --save
                - ""
                - --appendonly
                - "no"
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${{ internalSecret }}
                      key: redis-password
                # valkey-cli reads it (probes).
                - name: VALKEYCLI_AUTH
                  valueFrom:
                    secretKeyRef:
                      name: ${{ internalSecret }}
                      key: redis-password
              ports:
                - name: redis
                  containerPort: 6379
              readinessProbe:
                exec:
                  command: ["valkey-cli", "ping"]
                periodSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: redis
                initialDelaySeconds: 10
                periodSeconds: 15
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${{ redis }}
      labels: ${{ okdpLabels('redis') }}
    spec:
      type: ClusterIP
      ports:
        - name: redis
          port: 6379
          targetPort: redis
      selector: ${{ okdpSelectorLabels('redis') }}

  # The generated Secrets (okdpGeneratedSecret): one ESO Password generator
  # per key, and the ExternalSecret writing the Secret, generated once
  # (refreshInterval 0), kept on uninstall (keep):
  # - former module internal-secrets (a StringSecret): the Flask secret key and
  #   the Redis password. The password is alphanumeric: it lands in a redis://
  #   URL. The database outlives the release and its rows are encrypted with
  #   superset_secret_key;
  # - the password of the local admin user, only without OIDC (the only way in
  #   then), read by the init Job (SUPERSET_ADMIN_PASSWORD) when it creates the
  #   user "admin". The user lives in the metadata database, which outlives
  #   the release. Read it with
  #     kubectl get secret <release>-admin -o jsonpath='{.data.password}' | base64 -d
  - $spread: >-
      ${{ okdpGeneratedSecret({'name': internalSecret, 'annotations': keep, 'keys': [
            {'key': 'superset_secret_key', 'length': 42}, {'key': 'redis-password', 'length': 32}]}) }}
  - $spread: >-
      ${{ platform.oidc.enabled ? [] : okdpGeneratedSecret({'name': adminSecret, 'annotations': keep,
            'keys': [{'key': 'password', 'length': 24}]}) }}

# okdp.info.yaml: a UI, no provided connection.
instance:
  url: https://${{ host }}
  usage: |
    Apache Superset provides modern data visualization and exploration capabilities.
    Access the UI at https://${{ host }}
