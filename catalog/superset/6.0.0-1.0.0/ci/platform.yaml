# The platform values of the test cases (--context, level 0): global.okdp,
# as platform/platform-values.yaml gives them, the sandbox's (OIDC with
# existing OAuth clients). A case's own are in <case>-platform.yaml, over
# them; its connections in <case>-connections.yaml (--context 2:).
global:
  okdp:
    ingress:
      suffix: okdp.sandbox
      className: nginx
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      displayName: keycloak
      scope: openid profile email groups
      usePKCE: true
      clientProvisioning: existing
    proxy:
      httpProxy: ""
      httpsProxy: ""
      noProxy: ""
    certificateIssuers:
      selfSigned:
        name: default-issuer
