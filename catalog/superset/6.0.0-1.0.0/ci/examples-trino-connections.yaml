# The connections of the case examples-trino: the instance's own (--context 2:).
connections:
  demo-db-superset:
    contract: database-server
    engine: postgresql
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: superset
    secretRef:
      name: demo-pg-superset
  demo-db-examples:
    contract: database-server
    engine: postgresql
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: examples
    secretRef:
      name: demo-pg-examples
  shared-trino:
    contract: trino
    url: https://trino.example.com
    uri: trino://trino@trino.example.com:443
