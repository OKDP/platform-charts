# The connections of the case datasource-no-trino: the instance's own (--context 2:).
connections:
  meta:
    contract: database-server
    engine: postgresql
    host: pg.db.svc
    port: 5432
    dbName: superset
    secretRef: {name: pg-superset}
  shared-trino:
    contract: trino
    url: https://trino.example.com
    uri: trino://trino@trino.example.com:443
