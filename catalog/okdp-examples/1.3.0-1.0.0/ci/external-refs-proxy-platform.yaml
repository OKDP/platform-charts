# The platform values of the case external-refs-proxy, over platform.yaml (--context, level 0).
global:
  okdp:
    ingress:
      suffix: okdp.example.com
      className: nginx
    oidc:
      issuerUri: https://idp.example.com/realms/data
    proxy:
      httpProxy: http://proxy:3128
      httpsProxy: http://proxy:3128
      noProxy: .svc
