# External trino and iceberg-catalog connections, a store without internal
# URL, two realms, a forward proxy, sizing.
storage: store
s3SecretRef: seed-s3
trino: shared-trino
trinoOidcSecretRef: seed-trino
polaris: shared-polaris
cpu: 1
memoryGi: 1.5
bronzeBucket: s3://raw
polarisRealms:
  realms:
    - name: prod-eu.1
      principals:
        - name: admin
          principalRoles: [catalog_admin]
          credentialsSecret: {name: polaris-eu, clientIdKey: id, clientSecretKey: secret}
    - name: dev
      principals:
        - name: admin
          principalRoles: [catalog_admin, other]
          credentialsSecret: {name: polaris-dev, clientIdKey: id, clientSecretKey: secret}
