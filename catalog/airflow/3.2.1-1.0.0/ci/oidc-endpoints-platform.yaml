# The platform values of the case oidc-endpoints: OIDC on, the issuer only
# (--context, level 0).
global:
  okdp:
    ingress:
      suffix: example.org
      className: nginx
    certificateIssuers:
      selfSigned:
        name: letsencrypt
    oidc:
      issuerUri: https://sso.example.org/realms/data
