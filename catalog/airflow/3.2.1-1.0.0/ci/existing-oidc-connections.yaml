# The connections of the case existing-oidc: the instance's own (--context 2:).
connections:
  demo-db-airflow:
    contract: database-server
    engine: postgresql
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: airflow
    secretRef:
      name: demo-pg-airflow
  demo-storage:
    contract: s3
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
    secretRef:
      name: creds-seaweedfs-s3
