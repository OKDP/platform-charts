# OKDP's part of trino: the platform values it needs, its upstream charts'
# defaults and what an instance may override; then the mapping besides the
# charts' values (values.cel.yaml): the catalogs computed once (vars), the
# rules of the instance, its OAuth client (the former module oidc-dcr),
# OKDP's own objects, and what the instance publishes. ${{ ... }} is a CEL
# expression; Trino's own ${ENV:X} and Kubernetes' $(VAR) stay literal.

roles: [interactive-query]
dependsOn: [data-catalog, ingress]
require:
  - ingress.suffix
  - ingress.className
  - certificateIssuers.selfSigned.name
  - oidc.issuerUri
  - oidc.authUrl
  - oidc.tokenUrl
  - oidc.jwksUri
defaults:
  trino: trino.defaults.yaml
  opa-kube-mgmt: opa-kube-mgmt.defaults.yaml
  opal: opal.defaults.yaml
upstream:
  trino:
    # What the platform relies on: names used by the trino contract and the
    # OPA URL, OIDC sign-in, the ingress host registered with the identity
    # provider, OPA access control.
    protect: [fullnameOverride, server.config.authenticationType, server.config.https,
              server.coordinatorExtraConfig, auth, accessControl, ingress.enabled,
              ingress.className, ingress.hosts, ingress.tls]
    # The lists carrying OKDP's Secrets, truststore and shared secret: an
    # instance adds to them.
    append: [env, additionalConfigProperties, coordinator.additionalVolumes,
             coordinator.additionalVolumeMounts, coordinator.additionalJVMConfig,
             worker.additionalVolumes, worker.additionalVolumeMounts, worker.additionalJVMConfig]
  opa-kube-mgmt:
    # Besides names and the port Trino calls, the switches kept off for a
    # deterministic render (Flux and Argo CD must render the same objects):
    # admissionController, whose webhookconfiguration.yaml runs genCA and
    # genSignedCert on every render (the output uses them only when it is
    # enabled); prometheus and serviceMonitor, whose servicemonitor.yaml
    # reads .Capabilities.APIVersions, which differ between Flux and Argo CD.
    # The opa.certManagerApiVersion and opa.admissionregistrationApiVersion
    # helpers (.Capabilities) are included by webhookconfiguration.yaml only;
    # poddisruptionbudget.yaml (podDisruptionBudget.enabled, false) picks
    # policy/v1 on both engines. And the switches enableOPAL drives.
    protect: [fullnameOverride, authz, useHttps, port, admissionController, prometheus,
              serviceMonitor, mgmt.enabled, rbac.create, serviceAccount.create]
    append: [extraArgs]

vars:
  host: trino-${{ release.namespace }}.${{ global.okdp.ingress.suffix }}
  fullname: ${{ okdpFullname('trino') }}
  opaName: ${{ okdpFullname('opa') }}
  internalSecret: ${{ okdpFullname('internal') }}
  # Secrets of the OPAL tokens and keys, written by the opal-secrets hook.
  opalSecrets:
    ssh: ${{ okdpFullname('opal-ssh') }}
    master: ${{ okdpFullname('opal-master-token') }}
    client: ${{ okdpFullname('opal-client-token') }}
  # kubectl of the opal-secrets hook: the Kubernetes project image (distroless:
  # kubectl and kube-log-runner, no shell), pinned by digest.
  kubectlImage: registry.k8s.io/kubectl:v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b
  # The catalogs, connections resolved: name, env (prefix of its env
  # variables), storage (the s3 reference), s3Secret, warehouse and oidcSecret
  # (iceberg), properties (the catalog file). Credentials stay in Secrets and
  # reach the catalog files through ${ENV:...}.
  hive:
    - $for: c in values.hiveCatalogs
      $vars:
        env: ${{ c.name.upperAscii().replace('-', '_') }}
      $each:
        name: ${{ c.name }}
        env: ${{ env }}
        storage: ${{ c.storage.okdp.ref }}
        s3Secret: ${{ first([c.?s3SecretRef.orValue(''), values.s3SecretRef, c.storage.?secretRef.name.orValue('')]) }}
        properties: |-
          connector.name=hive
          hive.metastore.uri=${{ c.metastore.thriftUri }}
          fs.native-s3.enabled=true
          s3.endpoint=${{ c.storage.apiUrl }}
          s3.path-style-access=${{ c.storage.pathStyle }}
          s3.region=${{ c.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_${{ env }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_${{ env }}}
  iceberg:
    - $for: c in values.icebergCatalogs
      $vars:
        env: ${{ c.name.upperAscii().replace('-', '_') }}
        uri: ${{ first([c.catalog.?internalUri.orValue(''), c.catalog.uri]) }}
        warehouse: ${{ first([c.?warehouse.orValue(''), c.catalog.?realm.orValue('')]) }}
      $each:
        name: ${{ c.name }}
        env: ${{ env }}
        catalog: ${{ c.catalog.okdp.ref }}
        storage: ${{ c.storage.okdp.ref }}
        warehouse: ${{ warehouse }}
        s3Secret: ${{ first([c.?s3SecretRef.orValue(''), values.s3SecretRef, c.storage.?secretRef.name.orValue('')]) }}
        oidcSecret: ${{ first([c.?oidcSecretRef.orValue(''), 'creds-' + release.name + '-oauth2']) }}
        properties: |-
          connector.name=iceberg
          iceberg.catalog.type=rest
          iceberg.rest-catalog.uri=${{ uri }}
          iceberg.rest-catalog.warehouse=${{ warehouse }}
          iceberg.rest-catalog.security=OAUTH2
          iceberg.rest-catalog.oauth2.credential=${ENV:ICEBERG_OAUTH_${{ env }}}
          iceberg.rest-catalog.oauth2.scope=${{ first([c.?oauth2Scope.orValue(''), 'PRINCIPAL_ROLE:ALL']) }}
          iceberg.rest-catalog.oauth2.server-uri=${{ uri }}/v1/oauth/tokens
          iceberg.rest-catalog.vended-credentials-enabled=false
          fs.native-s3.enabled=true
          s3.endpoint=${{ c.storage.apiUrl }}
          s3.path-style-access=${{ c.storage.pathStyle }}
          s3.region=${{ c.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY_${{ env }}}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS_${{ env }}}
  catalogs: ${{ hive + iceberg }}

# Every message fails the compile, together.
errors:
  - $spread: >-
      ${{ catalogs.filter(c, c.s3Secret == '').map(c, 'trino: catalog "' + c.name + '": no S3 credentials, '
          + 'set s3SecretRef on the catalog or on the release, or a secretRef on connection "' + c.storage + '"') }}
  - $spread: >-
      ${{ iceberg.filter(c, c.warehouse == '').map(c, 'trino: catalog "' + c.name + '": no warehouse, '
          + 'and connection "' + c.catalog + '" publishes no realm: set warehouse') }}
  - $spread: >-
      ${{ catalogs.filter(c, c.name in ['tpch', 'tpcds'] || catalogs.filter(d, d.name == c.name).size() > 1)
          .map(c, 'trino: catalog name "' + c.name + '" is used twice (tpch and tpcds are built in)') }}

# The OAuth client (the former module oidc-dcr), registered by dynamic client
# registration in dcr mode (global.okdp.oidc.clientProvisioning: dcr): the
# compiler adds the chart oidc-dcr (Job <release>-oidc-dcr), which writes the
# Secret platform.oidcClientSecret (<release>-<namespace>-dcr). Nothing in
# existing mode.
oidcClients:
  - redirectUris: ['https://${{ host }}/oauth2/callback']
    grantTypes: [authorization_code, refresh_token, client_credentials]
    scope: web-origins acr roles profile groups basic email address phone organization offline_access microprofile-jwt
    request:
      logo_uri: https://landscape.cncf.io/logos/008125b82108f19aea6b0004ce5f255b72bab5b5e5c169a302d7bf845edb8e6b.svg

# OKDP's own objects, rendered by the umbrella (okdp.objects.yaml).
objects:
  # The shared secret of the coordinator/worker internal communication
  # (former module internal-secrets): an ESO Password generator and the
  # ExternalSecret writing the Secret, generated once (refreshInterval 0).
  - $spread: >-
      ${{ okdpGeneratedSecret({'name': internalSecret, 'keys': [{'key': 'shared-secret', 'length': 32}]}) }}
  # Former module opal-secrets, a pre-install/pre-upgrade hook (Argo:
  # PreSync), so the secrets exist before the OPAL pods start; idempotent:
  # when the three Secrets exist it leaves them alone. The keys (an RSA key
  # pair, a master token and a client JWT signed by that key) cannot come
  # from an ESO Password generator.
  - $for: "x in (values.enableOPA && values.enableOPAL ? [okdpFullname('opal-secrets')] : [])"
    $vars:
      hookLabels: ${{ okdpLabels('opal-secrets') }}
    $each:
      - apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${{ x }}
          labels: ${{ hookLabels }}
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${{ x }}
          labels: ${{ hookLabels }}
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create"]
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["${{ opalSecrets.ssh }}", "${{ opalSecrets.master }}", "${{ opalSecrets.client }}"]
            verbs: ["get", "update", "patch"]
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${{ x }}
          labels: ${{ hookLabels }}
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation
        subjects:
          - kind: ServiceAccount
            name: ${{ x }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: ${{ x }}
      - apiVersion: batch/v1
        kind: Job
        metadata:
          name: ${{ x }}
          labels: ${{ hookLabels }}
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-5"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        spec:
          backoffLimit: 3
          template:
            metadata:
              labels: ${{ hookLabels }}
            spec:
              restartPolicy: Never
              serviceAccountName: ${{ x }}
              volumes:
                - name: state
                  emptyDir: {}
                - name: shared-ssh
                  emptyDir: {}
                - name: shared-tokens
                  emptyDir: {}
              # Runs on every install, upgrade and Argo sync: decide once
              # whether the secrets exist, so the generators (an OPAL server
              # included) do not run, and cannot fail the sync, when there
              # is nothing to generate. The steps are sequential init
              # containers and the Secrets are written as a manifest, so
              # kubectl runs without a shell: registry.k8s.io/kubectl is
              # distroless (kubectl and kube-log-runner, which saves the
              # output of `kubectl get` to a file).
              initContainers:
                - name: check
                  image: ${{ kubectlImage }}
                  command:
                    - /bin/kube-log-runner
                    - -log-file=/state/existing.yaml
                    - -redirect-stderr=false
                    - /bin/kubectl
                    - get
                    - secret
                    - ${{ opalSecrets.ssh }}
                    - ${{ opalSecrets.master }}
                    - ${{ opalSecrets.client }}
                    - --ignore-not-found
                    - -o
                    # The existing Secrets as an apply-able manifest (name, type, data).
                    - 'jsonpath={range .items[*]}---{"\n"}apiVersion: v1{"\n"}kind: Secret{"\n"}metadata:{"\n"}  name: {.metadata.name}{"\n"}type: {.type}{"\n"}data: {.data}{"\n"}{end}'
                  volumeMounts:
                    - name: state
                      mountPath: /state
                - name: ssh-keygen
                  image: linuxserver/openssh-server:version-10.2_p1-r0
                  command:
                    - sh
                    - -c
                    - |
                      if [ "$(grep -c '^kind: Secret' /state/existing.yaml)" = 3 ]; then
                        echo "OPAL secrets already exist, keeping them."
                        touch /state/skip
                        exit 0
                      fi
                      ssh-keygen -t 'rsa' -b '4096' -f /mnt/id_rsa -N '' -m pem -q
                      chmod 644 /mnt/id_rsa /mnt/id_rsa.pub
                  volumeMounts:
                    - name: state
                      mountPath: /state
                    - name: shared-ssh
                      mountPath: /mnt
                - name: opal-token-generator
                  image: permitio/opal-server:0.9.4
                  env:
                    - name: UVICORN_NUM_WORKERS
                      value: "1"
                    - name: SSH_SECRET_NAME
                      value: ${{ opalSecrets.ssh }}
                    - name: MASTER_TOKEN_SECRET_NAME
                      value: ${{ opalSecrets.master }}
                    - name: JWT_CLIENT_TOKEN
                      value: ${{ opalSecrets.client }}
                  command:
                    - sh
                    - -c
                    - |
                      set -e
                      if [ -f /state/skip ]; then
                        # Re-applied unchanged: the tokens are kept.
                        cp /state/existing.yaml /opal/tokens/secrets.yaml
                        exit 0
                      fi
                      export OPAL_AUTH_PRIVATE_KEY="$(cat /opal/ssh/id_rsa)"
                      export OPAL_AUTH_PUBLIC_KEY="$(cat /opal/ssh/id_rsa.pub)"
                      export OPAL_AUTH_MASTER_TOKEN=$(opal-server generate-secret)
                      echo $OPAL_AUTH_MASTER_TOKEN > /opal/tokens/master-token.txt
                      start.sh &
                      timeout 30 sh -c "until wget -qO- http://localhost:7002/healthcheck 2>/dev/null | grep -q ok; do sleep 2; done"
                      echo $(opal-server obtain-token $OPAL_AUTH_MASTER_TOKEN --type=client) | tr -d '\n' > /opal/tokens/jwt.txt
                      b64() { base64 -w0 "$1"; }
                      cat > /opal/tokens/secrets.yaml <<EOF
                      ---
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $SSH_SECRET_NAME
                      type: Opaque
                      data:
                        OPAL_AUTH_PRIVATE_KEY: $(b64 /opal/ssh/id_rsa)
                        OPAL_AUTH_PUBLIC_KEY: $(b64 /opal/ssh/id_rsa.pub)
                      ---
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $MASTER_TOKEN_SECRET_NAME
                      type: Opaque
                      data:
                        OPAL_AUTH_MASTER_TOKEN: $(b64 /opal/tokens/master-token.txt)
                      ---
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: $JWT_CLIENT_TOKEN
                      type: Opaque
                      data:
                        OPAL_CLIENT_TOKEN: $(b64 /opal/tokens/jwt.txt)
                      EOF
                  volumeMounts:
                    - name: state
                      mountPath: /state
                      readOnly: true
                    - name: shared-ssh
                      mountPath: /opal/ssh
                      readOnly: true
                    - name: shared-tokens
                      mountPath: /opal/tokens
              containers:
                - name: kubectl
                  image: ${{ kubectlImage }}
                  command: [/bin/kubectl, apply, -f, /data/secrets.yaml]
                  volumeMounts:
                    - name: shared-tokens
                      mountPath: /data
                      readOnly: true

# okdp.info.yaml: what the console lists of the instance.
instance:
  url: https://${{ host }}
  usage: |
    Apache Trino provides distributed SQL query engine designed for large-scale data processing.
    Access the UI at https://${{ host }}

# The connections this instance publishes: other instances of the project
# reference it by its release name (the trino contract's naming convention,
# x-okdp-internal, which the compiler checks these values against).
provides:
  - contract: trino
    values:
      url: https://${{ host }}
      uri: trino://trino@${{ host }}:443
      internalUri: trino://trino@${{ fullname }}.${{ release.namespace }}.svc:8080
      catalogs: ${{ ['tpch', 'tpcds'] + catalogs.map(c, c.name) }}
