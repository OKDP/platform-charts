# OKDP's defaults of the spark-web-proxy chart (defaults in okdp.yaml), over
# its values.yaml and under the values computed by values.cel.yaml. Plain
# YAML, read as Helm reads a values file.
image:
  repository: quay.io/okdp/spark-web-proxy
  pullPolicy: IfNotPresent
  tag: "0.2.1"
configuration:
  spark:
    ui:
      proxyBase: /sparkui
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
