# OKDP's defaults of the hive-metastore chart (okdp.yaml defaults): over the
# chart's values.yaml, under the values computed by values.cel.yaml. Plain
# YAML, read as Helm reads a values file.
replicaCount: 1
image:
  repository: quay.io/okdp/hive-metastore
  tag: 4.0.1
  pullPolicy: IfNotPresent
logLevel: INFO
db:
  user:
    password:
      propertyName: password
cloud_storage: s3
s3:
  accessKey:
    propertyName: accessKey
  secretKey:
    propertyName: secretKey
gcs:
  enabled: false
