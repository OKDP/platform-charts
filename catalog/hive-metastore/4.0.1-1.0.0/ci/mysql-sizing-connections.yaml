# The connections of the case mysql-sizing: the instance's own (--context 2:).
connections:
  mysql:
    contract: database-server
    engine: mysql
    host: mysql.example.org
    port: 3306
    dbName: metastore
    secretRef:
      name: mysql-creds
  aws:
    contract: s3
    apiUrl: https://s3.eu-west-1.amazonaws.com
    region: eu-west-1
    pathStyle: false
