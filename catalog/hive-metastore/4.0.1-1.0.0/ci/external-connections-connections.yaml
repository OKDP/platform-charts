# The connections of the case external-connections: the instance's own (--context 2:).
connections:
  demo-db-hive:
    contract: database-server
    description: Hive metastore database
    engine: postgresql
    driver: org.postgresql.Driver
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: hive
    sslMode: disable
    secretRef:
      name: demo-pg-app
  demo-storage:
    contract: s3
    description: Platform S3 store, shared with this project
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
    secretRef:
      name: creds-seaweedfs-s3
