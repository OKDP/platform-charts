# OKDP's defaults of the bootstrap render of the polaris-admin chart (the key
# polaris-admin, defaults in okdp.yaml), over its values.yaml and under the
# values computed by values.cel.yaml. Plain YAML, read as Helm reads a values
# file.
phase: bootstrap
bootstrap:
  purge: false
  image:
    repository: apache/polaris-admin-tool
    tag: 1.3.0-incubating
    pullPolicy: IfNotPresent
  database:
    secret:
      usernameKey: username
      passwordKey: password
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
