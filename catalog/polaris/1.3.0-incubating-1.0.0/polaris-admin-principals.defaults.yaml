# OKDP's defaults of the principals render of the polaris-admin chart (the
# key polaris-admin-principals, defaults in okdp.yaml), over its values.yaml
# and under the values computed by values.cel.yaml. Plain YAML, read as Helm
# reads a values file.
phase: principals
principals:
  image:
    repository: curlimages/curl
    tag: 8.18.0
    pullPolicy: IfNotPresent
  # The chart defaults this to a bundle path, and curl refuses a --cacert
  # that does not exist. The in-cluster call is plain HTTP.
  caCertPath: ""
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
