# The platform values of the case dcr, over platform.yaml (--context, level 0).
global:
  okdp:
    ingress:
      suffix: okdp.sandbox
      className: nginx
    certificateIssuers:
      selfSigned:
        name: default-issuer
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      scope: openid profile email groups
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://keycloak.okdp.sandbox/realms/master/clients-registrations/openid-connect
        authMethod: anonymous
