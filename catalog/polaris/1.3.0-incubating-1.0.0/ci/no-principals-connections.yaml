# The connections of the case no-principals: the instance's own (--context 2:).
connections:
  pg:
    contract: database-server
    engine: postgresql
    host: pg.example.org
    port: 5432
    dbName: catalog
    secretRef:
      name: pg-catalog
  aws:
    contract: s3
    apiUrl: https://s3.eu-west-1.amazonaws.com
    region: eu-west-1
    pathStyle: false
