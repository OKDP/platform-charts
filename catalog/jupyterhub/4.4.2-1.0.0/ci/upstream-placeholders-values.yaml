# The placeholders of the free-text parameters (${suffix}, ${release},
# ${namespace}, NAMESPACE in sparkDefaults; ${connection}, ${storage.region}
# in the properties of a PySpark connection, $(S3_ACCESS_KEY) without its own
# identity; Spark's own ${env:...} left as written), and upstream values:
# a profile, a volume and a hub role appended, an env variable added, a
# workload identity on the spark ServiceAccount.
storage: demo-storage
s3SecretRef: creds-jupyterhub-s3
pyspark: [lakehouse-eu]
sparkConnections:
  - name: lakehouse-eu
    properties: |
      spark.hadoop.fs.s3a.endpoint.region=${storage.region}
      spark.sql.catalog.${connection}=org.apache.iceberg.spark.SparkCatalog
      spark.hadoop.fs.s3a.access.key=$(S3_ACCESS_KEY)
      spark.driver.extraClassPath=${env:SPARK_HOME}/jars
sparkDefaults:
  spark.app.name: ${release}-notebook
  spark.kubernetes.driver.label.okdp.io/namespace: NAMESPACE
  spark.sql.warehouse.dir: s3a://warehouse-${namespace}.${suffix}/
oidcRoleMapping:
  allowed_groups: [data_engineer]
welcomeNotebook: '{"cells": [], "metadata": {"hub": "${url}", "release": "${release}"}, "nbformat": 4, "nbformat_minor": 5}'
upstream:
  jupyterhub:
    hub:
      config:
        JupyterHub:
          load_roles:
            - {name: auditors, scopes: [read:users], groups: [auditors]}
    singleuser:
      extraEnv: {EXTRA_FLAG: "1"}
      storage:
        extraVolumes: [{name: shared, persistentVolumeClaim: {claimName: shared}}]
        extraVolumeMounts: [{name: shared, mountPath: /shared}]
      profileList:
        - display_name: Minimal
          kubespawner_override: {image: quay.io/jupyter/minimal-notebook}
  spark-rbac:
    serviceAccount:
      annotations: {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/spark"}
