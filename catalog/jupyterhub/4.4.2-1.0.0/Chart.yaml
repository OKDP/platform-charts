apiVersion: v2
name: jupyterhub
description: >-
  JupyterHub - Multi-user interactive development environment for data science and machine learning.
  Provides secure, scalable Jupyter notebook access with integrated authentication, resource management,
  and pre-configured Spark-enabled notebooks for big data analytics.
type: application
# <upstream>-<okdp semver>.
version: 4.4.2-1.0.0
appVersion: "4.4.2"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/jupyterhub/zero-to-jupyterhub-k8s
dependencies:
  # The former KuboCD module main: z2jh.
  - name: jupyterhub
    repository: https://hub.jupyter.org/helm-chart/
    version: 4.4.2
  # The former KuboCD module spark-rbac: the spark ServiceAccount and Role the
  # notebooks and their executors use.
  - name: spark-rbac
    repository: oci://quay.io/okdp/charts
    version: 1.0.1
