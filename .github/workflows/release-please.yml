name: release-please

# Every push to main is a candidate: release-please keeps one release pull
# request up to date, and cutting the release is merging that pull request.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OKDP'
    permissions:
      contents: write        # release-please tags/releases, and the compose step pushes
      pull-requests: write   # release-please opens/updates the release PR
    outputs:
      # JSON array of the package directories released by this run, "[]" when
      # this push only updated the release pull request.
      paths_released: ${{ steps.release-please.outputs.paths_released }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please owns only the OKDP half of the tag and writes it to
      # .release-please-manifest.json on its own branch. Join it with the
      # upstream half already in each Chart.yaml, on that same branch, before
      # anyone reviews the release pull request.
      - name: Compose the OCI tags
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          BRANCH: release-please--branches--${{ github.ref_name }}
        run: |
          git fetch origin "${BRANCH}:${BRANCH}"
          git checkout "${BRANCH}"
          bash .github/scripts/compose-oci-tag.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: compose the upstream version into the chart versions" || exit 0
          git push origin "${BRANCH}"

  publish:
    needs: [release-please]
    if: needs.release-please.outputs.paths_released != '[]'
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): switch to @v1 (and drop tools_ref) once released.
    # SECURITY (CI-01): @no-kubocd and tools_ref are mutable refs; pin both to
    # the same 40-hex commit SHA once the branch stops moving.
    uses: OKDP/gh-workflows/.github/workflows/okdp-chart-ci.yml@no-kubocd
    with:
      tools_ref: no-kubocd
      publish_to_registry: "true"
      oci_package_prefix: platform-charts
      # release-please has just minted versions that have never existed, so a
      # version already being on the registry means something is genuinely wrong.
      on_existing_tag: "fail"
      package_paths: ${{ needs.release-please.outputs.paths_released }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
