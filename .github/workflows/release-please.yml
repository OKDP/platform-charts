name: release-please

# Releases the catalog as a whole: every push to main is a candidate,
# release-please keeps one release pull request up to date (CHANGELOG.md),
# and merging it tags the repository vX.Y.Z, a ref a platform's
# catalog.yaml can pin. The packages' versions are their directories,
# catalog/<service>/<version>/, not release-please's: nothing is published.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OKDP'
    permissions:
      contents: write        # release-please tags and releases
      pull-requests: write   # release-please opens/updates the release PR
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
