# Tests the packages of an OKDP catalog repository (okdp-compiler format),
# every package directory of `packages` (catalog/<service>/<version>/, one
# holding Chart.yaml): scripts/compile-charts.sh compiles each
# ci/<case>-values.yaml test case with okdp-compile (built from
# OKDP/okdp-compiler) against the contracts of the repository (contracts/),
# checks the compiled values against the upstream charts (pulled into a chart
# cache), and renders each compiled umbrella with Helm. Nothing is
# published: the packages stay in Git, the upstream charts in their own
# repositories. The compiled cases are uploaded (artifact "compiled").
#
# This is the canonical copy (OKDP/platform-charts): the copies in other
# OKDP catalog repositories must stay byte-identical to it.

name: catalog

on:
  workflow_call:
    inputs:
      packages:
        description: Package directories, space separated, globs allowed (e.g. "catalog/*/*")
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v4.3.0
  # TODO(okdp-compiler): pin a release once published.
  OKDP_COMPILER_REPOSITORY: https://github.com/OKDP/okdp-compiler.git

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone okdp-compiler
        run: git clone --depth 1 "${OKDP_COMPILER_REPOSITORY}" ../okdp-compiler

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ../okdp-compiler/go.mod
          cache: false

      - name: Build okdp-compile
        run: |
          set -euo pipefail
          (cd ../okdp-compiler && go build -o "${RUNNER_TEMP}/bin/okdp-compile" ./cmd/okdp-compile)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set up helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: List the packages
        id: packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          packages=()
          # Word splitting and globbing of PACKAGES are intended.
          # shellcheck disable=SC2086
          for d in ${PACKAGES}; do
            [[ -f "${d}/Chart.yaml" ]] && packages+=("${d%/}")
          done
          [[ ${#packages[@]} -gt 0 ]] || { echo "::error::no package under: ${PACKAGES}"; exit 1; }
          printf '%s\n' "${packages[@]}"
          echo "list=${packages[*]}" >> "${GITHUB_OUTPUT}"

      - name: Compile, check and render the test cases
        env:
          PACKAGES: ${{ steps.packages.outputs.list }}
        run: |
          set -euo pipefail
          export OKDP_CHARTS="${RUNNER_TEMP}/charts" OUT="${RUNNER_TEMP}/compiled"
          # The packages are space separated.
          # shellcheck disable=SC2086
          scripts/compile-charts.sh ${PACKAGES}

      - name: Upload the compiled cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled
          path: ${{ runner.temp }}/compiled
          if-no-files-found: ignore
