name: publish

# Manual (re)publication of every chart to oci://quay.io/okdp/platform-charts,
# at its Chart.yaml version. Versions already published are left alone.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository_owner == 'OKDP'
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): switch to @v1 (and drop tools_ref) once released.
    uses: OKDP/gh-workflows/.github/workflows/okdp-chart-ci.yml@no-kubocd
    with:
      tools_ref: no-kubocd
      # okdp-lib is a file:// dependency on ../okdp-lib during the migration.
      sibling_repositories: OKDP/okdp-lib@main
      publish_to_registry: "true"
      oci_package_prefix: platform-charts
      on_existing_tag: "skip"
      descriptor_optional: "oidc-client"
    secrets: inherit
