name: ci

# Tests every changed chart (a change under .github/ selects every chart) and
# pushes CI builds to oci://ghcr.io/okdp/platform-charts/charts. okdp-lib
# lives in OKDP/okdp-lib: a change there does not re-test these charts.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
  push:
    branches:
      - '**'
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): switch to @v1 (and drop tools_ref) once released.
    uses: OKDP/gh-workflows/.github/workflows/okdp-chart-ci.yml@no-kubocd
    with:
      tools_ref: no-kubocd
      # okdp-lib is a file:// dependency on ../okdp-lib during the migration.
      sibling_repositories: OKDP/okdp-lib@main
      publish_to_registry: "false"
      # pull requests from forks cannot write packages: validate only
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
