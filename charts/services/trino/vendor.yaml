# Upstream charts rendered by okdp.vendor.render (the former KuboCD modules).
# Refresh vendor/ with: scripts/vendor-charts.sh charts/services/trino
charts:
  - name: trino               # module main
    repository: https://trinodb.github.io/charts
    version: 1.42.2
  - name: opa-kube-mgmt       # module opa (enableOPA)
    repository: https://open-policy-agent.github.io/kube-mgmt/charts
    version: 11.0.12
  - name: opal                # module opal (enableOPA and enableOPAL)
    repository: https://permitio.github.io/opal-helm-chart
    version: 0.0.30
  - name: oidc-dcr            # module oidc-dcr (global.okdp.oidc.clientProvisioning: dcr)
    repository: oci://quay.io/adaltas
    version: 0.3.3
