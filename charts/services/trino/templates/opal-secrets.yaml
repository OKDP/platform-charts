{{- /*
Former module opal-secrets (quay.io/okdp/charts/opal-secrets 0.1.1), rewritten
here instead of vendored:
- it is a pre-install/pre-upgrade hook (Argo: PreSync), so the secrets exist
  before the OPAL pods start and nothing waits on a plain Job that
  ttlSecondsAfterFinished deletes (Argo would recreate it on every sync);
- it is idempotent: when the three Secrets exist it leaves them alone, so the
  tokens are generated once, not on every sync or upgrade;
- the Secret names derive from the release (two instances no longer share
  opal-ssh-secret & co).
The keys (an RSA key pair, a master token and a client JWT signed by that key)
cannot come from an ESO Password generator.
*/}}
{{- if and .Values.enableOPA .Values.enableOPAL }}
{{- $name := include "okdp.fullname" (dict "ctx" . "suffix" "opal-secrets") }}
{{- $secrets := include "okdp-trino.opalSecrets" . | fromYaml }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp.labels" (dict "ctx" . "component" "opal-secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp.labels" (dict "ctx" . "component" "opal-secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secrets.ssh | quote }}, {{ $secrets.master | quote }}, {{ $secrets.client | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp.labels" (dict "ctx" . "component" "opal-secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp.labels" (dict "ctx" . "component" "opal-secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "okdp.labels" (dict "ctx" . "component" "opal-secrets") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      volumes:
        - name: state
          emptyDir: {}
        - name: shared-ssh
          emptyDir: {}
        - name: shared-tokens
          emptyDir: {}
      # Runs on every install, upgrade and Argo sync: decide once whether the
      # secrets exist, so the generators (an OPAL server included) do not run,
      # and cannot fail the sync, when there is nothing to generate. The
      # steps are sequential init containers and the Secrets are written as
      # a manifest, so kubectl runs without a shell: registry.k8s.io/kubectl
      # is distroless (kubectl and kube-log-runner, which saves the output of
      # `kubectl get` to a file).
      initContainers:
        - name: check
          image: {{ include "okdp-trino.kubectlImage" . }}
          command:
            - /bin/kube-log-runner
            - -log-file=/state/existing.yaml
            - -redirect-stderr=false
            - /bin/kubectl
            - get
            - secret
            - {{ $secrets.ssh | quote }}
            - {{ $secrets.master | quote }}
            - {{ $secrets.client | quote }}
            - --ignore-not-found
            - -o
            # The existing Secrets as an apply-able manifest (name, type, data).
            - 'jsonpath={range .items[*]}---{"\n"}apiVersion: v1{"\n"}kind: Secret{"\n"}metadata:{"\n"}  name: {.metadata.name}{"\n"}type: {.type}{"\n"}data: {.data}{"\n"}{end}'
          volumeMounts:
            - name: state
              mountPath: /state
        - name: ssh-keygen
          image: linuxserver/openssh-server:version-10.2_p1-r0
          command:
            - sh
            - -c
            - |
              if [ "$(grep -c '^kind: Secret' /state/existing.yaml)" = 3 ]; then
                echo "OPAL secrets already exist, keeping them."
                touch /state/skip
                exit 0
              fi
              ssh-keygen -t 'rsa' -b '4096' -f /mnt/id_rsa -N '' -m pem -q
              chmod 644 /mnt/id_rsa /mnt/id_rsa.pub
          volumeMounts:
            - name: state
              mountPath: /state
            - name: shared-ssh
              mountPath: /mnt
        - name: opal-token-generator
          image: permitio/opal-server:0.9.4
          env:
            - name: UVICORN_NUM_WORKERS
              value: "1"
            - name: SSH_SECRET_NAME
              value: {{ $secrets.ssh | quote }}
            - name: MASTER_TOKEN_SECRET_NAME
              value: {{ $secrets.master | quote }}
            - name: JWT_CLIENT_TOKEN
              value: {{ $secrets.client | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /state/skip ]; then
                # Re-applied unchanged: the tokens are kept.
                cp /state/existing.yaml /opal/tokens/secrets.yaml
                exit 0
              fi
              export OPAL_AUTH_PRIVATE_KEY="$(cat /opal/ssh/id_rsa)"
              export OPAL_AUTH_PUBLIC_KEY="$(cat /opal/ssh/id_rsa.pub)"
              export OPAL_AUTH_MASTER_TOKEN=$(opal-server generate-secret)
              echo $OPAL_AUTH_MASTER_TOKEN > /opal/tokens/master-token.txt
              start.sh &
              timeout 30 sh -c "until wget -qO- http://localhost:7002/healthcheck 2>/dev/null | grep -q ok; do sleep 2; done"
              echo $(opal-server obtain-token $OPAL_AUTH_MASTER_TOKEN --type=client) | tr -d '\n' > /opal/tokens/jwt.txt
              b64() { base64 -w0 "$1"; }
              cat > /opal/tokens/secrets.yaml <<EOF
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: $SSH_SECRET_NAME
              type: Opaque
              data:
                OPAL_AUTH_PRIVATE_KEY: $(b64 /opal/ssh/id_rsa)
                OPAL_AUTH_PUBLIC_KEY: $(b64 /opal/ssh/id_rsa.pub)
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: $MASTER_TOKEN_SECRET_NAME
              type: Opaque
              data:
                OPAL_AUTH_MASTER_TOKEN: $(b64 /opal/tokens/master-token.txt)
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: $JWT_CLIENT_TOKEN
              type: Opaque
              data:
                OPAL_CLIENT_TOKEN: $(b64 /opal/tokens/jwt.txt)
              EOF
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
            - name: shared-ssh
              mountPath: /opal/ssh
              readOnly: true
            - name: shared-tokens
              mountPath: /opal/tokens
      containers:
        - name: kubectl
          image: {{ include "okdp-trino.kubectlImage" . }}
          command: [/bin/kubectl, apply, -f, /data/secrets.yaml]
          volumeMounts:
            - name: shared-tokens
              mountPath: /data
              readOnly: true
{{- end }}
