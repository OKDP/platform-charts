# No catalog (tpch and tpcds only), OPA with kube-mgmt (the chart defaults).
global:
  okdp:
    ingress: {suffix: okdp.sandbox, className: nginx}
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      clientId: okdp-ui
      authUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/auth
      tokenUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/token
      jwksUri: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/certs
      userinfoUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/userinfo
      scope: "openid profile email groups"
      clientProvisioning: existing
    proxy: {httpProxy: "", httpsProxy: "", noProxy: ""}
    certificateIssuers: {selfSigned: {name: default-issuer}}
    storageClass: {data: standard, workspace: standard}
