# Instance-level upstream values (upstream.trino, upstream.opa-kube-mgmt) over
# the internal-hive setup with OPA on: overrides, list appends, an extra catalog.
global:
  okdp:
    ingress: {suffix: okdp.sandbox, className: nginx}
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      clientId: okdp-ui
      authUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/auth
      tokenUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/token
      jwksUri: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/certs
      userinfoUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/userinfo
      scope: "openid profile email groups"
      clientProvisioning: existing
    proxy: {httpProxy: "", httpsProxy: "", noProxy: ""}
    certificateIssuers: {selfSigned: {name: default-issuer}}
    storageClass: {data: standard, workspace: standard}
connections:
  demo-storage:
    contract: s3
    description: Platform S3 store, shared with this project
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
    secretRef: {name: creds-seaweedfs-s3}
s3SecretRef: creds-trino-s3
hiveCatalogs:
  - name: bronze
    metastore: demo-hive
    storage: demo-storage
enableOPA: true
upstream:
  trino:
    image: {repository: mirror.example.org/trinodb/trino}
    server:
      config:
        query: {maxMemory: 8GB}
    worker:
      tolerations:
        - {key: dedicated, operator: Exists, effect: NoSchedule}
    env:
      - {name: EXTRA_FLAG, value: "1"}
    additionalConfigProperties:
      - http-server.log.enabled=false
    catalogs:
      memory: |
        connector.name=memory
  opa-kube-mgmt:
    resources:
      limits: {memory: 256Mi}
    extraArgs:
      - --log-level=debug
