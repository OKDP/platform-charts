# Upstream charts rendered by okdp.vendor.render (the former KuboCD modules).
# vendor/ is downloaded, not committed: scripts/vendor-charts.sh charts/services/superset
charts:
  - name: superset            # module main: the Apache Superset chart
    repository: https://apache.github.io/superset
    version: 0.22.8
    # Bundled bitnami charts, both disabled: postgresql (metadataDb is an
    # external database) and redis (templates/valkey.yaml replaces it).
    drop: [charts/postgresql, charts/redis]
  - name: oidc-dcr            # module oidc-dcr (global.okdp.oidc.clientProvisioning: dcr)
    repository: oci://quay.io/adaltas
    version: 0.3.3
