{{- /*
Former module internal-secrets (a StringSecret): the Flask secret key and the
Redis password, generated once by ESO. The password is alphanumeric: it lands
in a redis:// URL. Kept when the release goes away (Helm keep, Argo CD
Delete=false) and adopted again by the next install: the database outlives the
release and its rows are encrypted with superset_secret_key.
*/}}
{{ include "okdp.generatedSecretExt" (dict "ctx" . "name" (include "okdp-superset-wrapper.internalSecret" .)
     "keys" (list (dict "key" "superset_secret_key" "length" 42) (dict "key" "redis-password" "length" 32))
     "annotations" (dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-options" "Delete=false")) }}
