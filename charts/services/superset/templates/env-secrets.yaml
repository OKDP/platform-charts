{{- /*
The env Secrets the Superset pods load (envFromSecret, envFromSecrets) and
the Python config reads, formerly rendered by OKDP's wrapper chart
(quay.io/okdp/charts/superset): <release>-db-env, -oauth2-env, -redis-env,
-superset-env, -trino-oauth2-env. No credential: those are secretKeyRefs.
*/ -}}
{{- range $suffix, $data := include "okdp-superset-wrapper.envSecrets" . | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "okdp-superset-wrapper.envSecret" (dict "ctx" $ "suffix" $suffix) }}
  labels:
    {{- include "okdp.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
