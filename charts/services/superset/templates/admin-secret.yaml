{{- /*
Password of the local admin user, only without OIDC (the only way in then):
generated once by ESO, read by the init Job (SUPERSET_ADMIN_PASSWORD) when it
creates the user "admin". Kept with the release's other credentials (Helm
keep, Argo CD Delete=false): the user lives in the metadata database, which
outlives the release. Read it with
  kubectl get secret <release>-admin -o jsonpath='{.data.password}' | base64 -d
*/}}
{{- $oidc := include "okdp.oidc" . | fromYaml -}}
{{- if not $oidc.enabled }}
{{ include "okdp.generatedSecret" (dict "ctx" . "name" (include "okdp-superset-wrapper.adminSecret" .)
     "keys" (list (dict "key" "password" "length" 24))
     "annotations" (dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-options" "Delete=false")) }}
{{- end }}
