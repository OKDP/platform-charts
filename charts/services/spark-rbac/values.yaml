# Platform values (platform/platform-values.yaml). Never set per instance.
global:
  okdp: {}

# External connections, one values layer per projects/<project>/connections/<name>.yaml.
connections: {}

# Create the Role spark-role and its RoleBinding spark-rolebinding.
rbacCreate: true
# Create the ServiceAccount the Spark jobs run as.
serviceAccountCreate: true
# Name of the ServiceAccount (created or existing).
serviceAccountName: spark
# Mount the ServiceAccount token in the pods.
automountServiceAccountToken: true

# Values of the upstream chart, merged over the ones computed from the
# parameters above (templates/_values.tpl, okdp-spark-rbac.upstream): any
# upstream value can be set except the protected ones, e.g.
#   upstream:
#     spark-rbac:
#       serviceAccount:
#         annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/spark}
upstream: {}
