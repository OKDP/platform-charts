apiVersion: v2
name: okdp-examples
description: >-
  A collection of hands-on examples, helper utilities, Jupyter notebooks,
  and data workflows that showcases how to work with the OKDP Platform.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.3.0-1.0.1
appVersion: "1.3.0"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/OKDP/okdp-examples
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: examples
  okdp.io/depends-on: storage,metastore-catalog,iceberg-catalog,interactive-query
dependencies:
  - name: okdp-lib
    version: ">=0.1.0 <1.0.0"
    # TODO(no-kubocd): switch to oci://quay.io/okdp/platform-charts
    repository: file://../../../../okdp-lib
