# The demo project: internal trino and polaris releases (demo-trino,
# demo-polaris), the platform S3 store as a connection file, one realm.
global:
  okdp:
    ingress: {suffix: okdp.sandbox, className: nginx}
    oidc:
      issuerUri: https://keycloak.okdp.sandbox/realms/master
    proxy: {httpProxy: "", httpsProxy: "", noProxy: ""}
    certificateIssuers: {selfSigned: {name: default-issuer}}
connections:
  demo-storage:
    contract: s3
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
storage: demo-storage
s3SecretRef: creds-examples-s3
trino: demo-trino
trinoOidcSecretRef: creds-examples-trino-oauth2
polaris: demo-polaris
polarisRealms:
  realms:
    - name: sandbox
      catalogs:
        - {name: silver, storageLocation: s3://silver}
      principals:
        - name: reader
          principalRoles: [catalog_reader]
        - name: admin
          principalRoles: [catalog_admin]
          credentialsSecret: {name: creds-polaris-admin, clientIdKey: client_id, clientSecretKey: client_secret}
