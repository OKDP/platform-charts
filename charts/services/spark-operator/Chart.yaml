apiVersion: v2
name: spark-operator
description: >-
  Spark Operator 2.5.2 - Kubernetes operator for managing Apache Spark applications.
  Runs Spark applications on Kubernetes through custom resources (SparkApplication CRD).
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 2.5.2-1.0.0
appVersion: "2.5.2"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/kubeflow/spark-operator
annotations:
  # Former KuboCD package roles, kept for the catalog.
  okdp.io/roles: sparkOperator
dependencies:
  - name: okdp-lib-chart
    version: ">=0.1.0 <1.0.0"
    repository: oci://quay.io/okdp
