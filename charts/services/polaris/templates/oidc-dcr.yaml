{{- /* Module oidc-dcr, enabled when the platform registers clients by DCR: the server's and the console's clients. */}}
{{- if (include "okdp.oidc" . | fromYaml).dcr.enabled }}
{{ include "okdp.vendor.oidcDcr" (dict "ctx" . "values" (include "okdp-polaris.values.dcr" . | fromYaml)) }}
{{ include "okdp.vendor.oidcDcr" (dict "ctx" . "values" (include "okdp-polaris.values.consoleDcr" . | fromYaml) "name" (include "okdp.fullname" (dict "ctx" . "suffix" "console-oidc-dcr"))) }}
{{- end }}
