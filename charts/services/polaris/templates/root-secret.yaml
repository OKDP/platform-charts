{{- /*
Former module internal-secrets: the root credentials of the realm
(client_id: root, a generated client_secret), generated once by ESO. Kept
when the release goes away (was keep: true): the bootstrapped realm lives on
in the database with these credentials.
*/}}
{{ include "okdp.generatedSecretExt" (dict "ctx" . "name" (include "okdp-polaris.rootSecret" .)
     "keys" (list (dict "key" "client_secret" "length" 32))
     "stringData" (dict "client_id" "root")
     "annotations" (dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-options" "Delete=false")) }}
