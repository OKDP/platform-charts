# The demo project with the server's and the console's OAuth clients registered by
# DCR (<release>-<namespace>-dcr, <release>-<namespace>-console-dcr).
global:
  okdp:
    ingress: {suffix: okdp.sandbox, className: nginx}
    certificateIssuers: {selfSigned: {name: default-issuer}}
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      scope: "openid profile email groups"
      clientProvisioning: dcr
      dcr: {registrationUrl: https://keycloak.okdp.sandbox/realms/master/clients-registrations/openid-connect, authMethod: anonymous}
connections:
  demo-db-polaris:
    contract: database-server
    description: Polaris metastore database
    engine: postgresql
    host: demo-pg-rw.demo.svc.cluster.local
    port: 5432
    dbName: polaris
    sslMode: disable
    secretRef: {name: demo-pg-polaris}
  demo-storage:
    contract: s3
    description: Platform S3 store, shared with this project
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
    secretRef: {name: creds-seaweedfs-s3}
db: demo-db-polaris
storage: demo-storage
s3SecretRef: creds-polaris-s3
realm: SANDBOX
principals:
  - name: service-account-polaris-admin
    roles: [service_admin, catalog_admin]
