# Fixed values of the vendored polaris-console chart (vendor/polaris-console),
# merged over its values.yaml and under the values computed by
# templates/_values.tpl (okdp.vendor.render "valuesFile"). Plain YAML, not a
# template.
image:
  repository: quay.io/okdp/polaris-console
  tag: v0.1.1
  pullPolicy: Always
extraEnv:
  # dcr mode: read from the console's DCR Secret instead (templates/polaris-console.yaml).
  VITE_OIDC_CLIENT_ID: "polaris-console"
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
