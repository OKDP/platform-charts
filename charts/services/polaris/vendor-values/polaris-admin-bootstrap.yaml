# Fixed values of the bootstrap render of the vendored polaris-admin chart
# (vendor/polaris-admin), merged over its values.yaml and under the values
# computed by templates/_values.tpl (okdp.vendor.render "valuesFile"). Plain
# YAML, not a template.
phase: bootstrap
bootstrap:
  purge: false
  image:
    repository: apache/polaris-admin-tool
    tag: 1.3.0-incubating
    pullPolicy: IfNotPresent
  database:
    secret:
      usernameKey: username
      passwordKey: password
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
