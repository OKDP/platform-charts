# Upstream charts rendered by okdp.vendor.render (the former KuboCD modules).
# vendor/ is downloaded, not committed: scripts/vendor-charts.sh charts/services/polaris
charts:
  - name: polaris             # module main
    repository: https://downloads.apache.org/polaris/helm-chart/
    version: 1.3.0-incubating
  - name: polaris-admin       # modules bootstrap and principals (rendered twice, one phase each)
    repository: oci://quay.io/okdp/charts
    version: 1.0.0
  - name: polaris-console     # module console
    repository: oci://quay.io/okdp/charts
    version: 0.2.0
  - name: oidc-dcr            # module oidc-dcr (global.okdp.oidc.clientProvisioning: dcr)
    repository: oci://quay.io/adaltas
    version: 0.3.3
