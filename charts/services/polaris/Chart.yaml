apiVersion: v2
name: polaris
description: >-
  Apache Polaris is an open-source, fully-featured catalog for Apache Iceberg™.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.3.0-incubating-1.0.0
appVersion: "1.3.0-incubating"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/apache/polaris
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: data-catalog,iceberg-catalog
  okdp.io/depends-on: identity,storage,database-server,ingress
dependencies:
  - name: okdp-lib-chart
    version: ">=0.2.0 <1.0.0"
    repository: oci://quay.io/okdp/charts
