# Reviewed exceptions of the vendored charts (gh-workflows okdp-chart-guard.sh).
# The wrapper's schema exposes none of the values named in disabledBy: they
# are set by templates/_values.tpl only.

# The hub Secret passwords: lookup of the previous Secret, else random. The
# wrapper sets the three hub.config values to a placeholder (so the helpers
# return it) and keeps hub.services empty (no api token to generate). The
# real values are in the ESO-generated <release>-hub-generated
# (templates/hub-generated.yaml): the hub reads it first (hub.existingSecret),
# the proxy token references are re-pointed to it (okdp.vendor.secretKeyRef),
# and the hub pops the placeholders from hub.config.
- file: vendor/jupyterhub/templates/hub/_helpers-passwords.tpl
  pattern: lookup
  reason: the passwords are generated by ESO; the chart only ever sees the placeholder values
  disabledBy: hub.config (ConfigurableHTTPProxy.auth_token, JupyterHub.cookie_secret, CryptKeeper.keys set to a placeholder) and hub.services={}
- file: vendor/jupyterhub/templates/hub/_helpers-passwords.tpl
  pattern: non-deterministic
  reason: randAlphaNum/randNumeric (jupyterhub.randHex) only run when the values above are empty
  disabledBy: hub.config (ConfigurableHTTPProxy.auth_token, JupyterHub.cookie_secret, CryptKeeper.keys set to a placeholder) and hub.services={}
# The pre-pull hook compares its checksum with the previous one (lookup).
- file: vendor/jupyterhub/templates/image-puller/_helpers-daemonset.tpl
  pattern: lookup
  reason: only evaluated for the pre-pull hook, which the wrapper disables
  disabledBy: prePuller.hook.enabled=false
