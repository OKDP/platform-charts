# Platform values (platform/platform-values.yaml). Never set per instance.
# Read here: ingress.{suffix,className}, certificateIssuers.selfSigned.name,
# storageClass.workspace, oidc.{authUrl,tokenUrl,userinfoUrl,displayName}, proxy.
global:
  okdp: {}

# External connections, one values layer per projects/<project>/connections/<name>.yaml.
connections: {}

# Notebook (singleuser) pod CPU guarantee in vCPU. The limit is twice the guarantee.
cpu: 0.5
# Notebook (singleuser) pod memory guarantee in GiB. The limit is twice the guarantee.
memoryGi: 1

# s3 connection of the object store backing the jupyter-fs file browser (required).
storage: ""
# Secret with keys accessKey/secretKey: this instance's own S3 identity (required).
s3SecretRef: ""

# GenericOAuthenticator overrides (claim_groups_key, allowed_groups, admin_groups, ...).
# Without allowed_groups the hub answers 403 to everyone.
oidcRoleMapping: {}

# jupyter-fs file browser locations:
#   - {name: bronze, uri: s3://bronze}
fileBrowserLocations: []

# Welcome.ipynb content copied into each user home. The placeholders
# {{ .Values.global.okdp.ingress.suffix }}, {{ .Release.Name }} and
# {{ .Release.Namespace }} (and their KuboCD forms {{ .Context.ingress.suffix }},
# {{ .Release.metadata.name }}, {{ .Release.namespace }}) are replaced.
welcomeNotebook: ""

# PySpark connections (was `connections` under KuboCD: that name is now the
# external connections map). Each item carries its final spark conf lines and
# optionally its own S3 identity (Secret with accessKey/secretKey):
#   - name: lakehouse
#     s3SecretRef: creds-examples-s3
#     properties: |
#       spark.hadoop.fs.s3a.endpoint={{ storage.endpoints.apiUrl }}
#       spark.hadoop.fs.s3a.access.key=$(S3_ACCESS_KEY)
sparkConnections: []
# Names of the sparkConnections to wire into the PySpark kernel. Empty leaves
# the kernel without S3A or catalog settings.
pyspark: []
# Spark conf defaults injected into PYSPARK_SUBMIT_ARGS (final values).
sparkDefaults: {}

# Values of the upstream charts, merged over the ones computed from the
# parameters above (templates/_values.tpl, okdp-jupyterhub.upstream.*): any
# upstream value can be set except the protected ones, e.g.
#   upstream:
#     jupyterhub:
#       singleuser: {nodeSelector: {workload: notebooks}}
#       cull: {enabled: true, timeout: 7200}
#     spark-rbac:
#       serviceAccount: {annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/spark}}
upstream: {}
