apiVersion: v2
name: jupyterhub
description: >-
  JupyterHub - Multi-user interactive development environment for data science and machine learning.
  Provides secure, scalable Jupyter notebook access with integrated authentication, resource management,
  and pre-configured Spark-enabled notebooks for big data analytics.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 4.4.2-1.0.1
appVersion: "4.4.2"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/jupyterhub/zero-to-jupyterhub-k8s
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: notebooks
  okdp.io/depends-on: ingress,storage
dependencies:
  - name: okdp-lib
    version: ">=0.1.0 <1.0.0"
    # TODO(no-kubocd): switch to oci://quay.io/okdp/platform-charts
    repository: file://../../../../okdp-lib
