{{- /* Module oidc-dcr, enabled when the platform registers clients by DCR. */}}
{{- if (include "okdp.oidc" . | fromYaml).dcr.enabled }}
{{ include "okdp.oidc.dcr" (dict "ctx" .
     "redirectUris" (list (printf "%s/hub/oauth_callback" (include "okdp-jupyterhub.url" .)))
     "grantTypes" (list "authorization_code" "refresh_token")
     "scope" (include "okdp-jupyterhub.scope" .)) }}
{{- end }}
