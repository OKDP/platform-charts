{{- /*
The OIDC filter's cookie encryption key, per instance, generated once by ESO.
The filter reads it from AUTH_COOKIE_ENCRYPTION_KEY when the Spark property
cookie-cipher-secret-key is unset: its UTF-8 bytes are the AES key, so the
length must be 16, 24 or 32 (32: AES-256). Regenerated only if the Secret is
deleted, which only signs every user out.
*/}}
{{- $oidc := include "okdp.oidc" . | fromYaml -}}
{{- if $oidc.enabled }}
{{ include "okdp.generatedSecret" (dict "ctx" . "name" (include "okdp-shs.cookieSecret" .)
     "keys" (list (dict "key" "cookie-cipher-secret-key" "length" 32))) }}
{{- end }}
