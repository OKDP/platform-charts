apiVersion: v2
name: spark-history-server
description: >-
  Spark History Server - Monitoring and debugging interface for Apache Spark applications.
  Provides detailed execution metrics, job timelines, and performance insights for completed Spark jobs.
  Essential tool for optimizing Spark workloads and troubleshooting data processing pipelines.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 3.5.1-1.0.1
appVersion: "3.5.1"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/OKDP/spark-history-server
  - https://github.com/OKDP/spark-web-proxy
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: spark
  okdp.io/depends-on: identity,storage,ingress
dependencies:
  - name: okdp-lib-chart
    version: ">=0.1.0 <1.0.0"
    # TODO: switch to oci://quay.io/okdp/okdp-lib-chart once published there
    repository: https://repo.alliage.io/repository/okdp
