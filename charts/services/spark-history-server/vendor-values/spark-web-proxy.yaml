# Fixed values of the vendored spark-web-proxy chart (vendor/spark-web-proxy),
# merged over its values.yaml and under the values computed by
# templates/_values.tpl (okdp.vendor.render "valuesFile"). Plain YAML, not a
# template.
image:
  repository: quay.io/okdp/spark-web-proxy
  pullPolicy: IfNotPresent
  tag: "0.2.1"
configuration:
  spark:
    ui:
      proxyBase: /sparkui
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
