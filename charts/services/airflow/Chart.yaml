apiVersion: v2
name: airflow
description: >-
  Apache Airflow 3.2.1 - Workflow orchestration platform with Spark Operator integration.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 3.2.1-1.0.0
appVersion: "3.2.1"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/apache/airflow
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: airflow
  okdp.io/depends-on: external-secrets,database-server,ingress,storage
dependencies:
  - name: okdp-lib-chart
    version: ">=0.2.0 <1.0.0"
    repository: oci://quay.io/okdp
