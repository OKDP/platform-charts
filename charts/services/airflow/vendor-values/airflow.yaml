# Fixed values of the vendored airflow chart (vendor/airflow), merged over its
# values.yaml and under the values computed by templates/_values.tpl
# (okdp.vendor.render "valuesFile"). Plain YAML, not a template.
executor: KubernetesExecutor
defaultAirflowTag: "3.2.1"
airflowVersion: "3.2.1"
# The CA bundle the extraEnv variables point at, mounted in every Airflow
# container: a component without it fails any HTTPS call, and the CLI
# itself talks to the API server over HTTPS.
volumes:
  - name: cacerts
    secret:
      secretName: certs-bundle
volumeMounts:
  - name: cacerts
    mountPath: /cacerts
apiServer:
  resources:
    requests:
      memory: 384Mi
      cpu: 200m
    limits:
      cpu: 1000m
  startupProbe:
    failureThreshold: 24
    timeoutSeconds: 30
scheduler:
  resources:
    requests:
      memory: 384Mi
      cpu: 200m
    limits:
      cpu: 1000m
  startupProbe:
    failureThreshold: 12
    timeoutSeconds: 60
triggerer:
  enabled: true
  # The default 20s probe times out on small nodes and kills a healthy triggerer.
  livenessProbe:
    timeoutSeconds: 60
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 300m
ingress:
  apiServer:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
dags:
  mountPath: /opt/airflow/dags
  persistence:
    enabled: false
dagProcessor:
  enabled: true
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
flower:
  enabled: false
pgbouncer:
  enabled: false
statsd:
  enabled: false
# Off: its password secret template calls randAlphaNum (okdp-guard-allow.yaml).
redis:
  enabled: false
workers:
  replicas: 0
postgresql:
  enabled: false
webserver:
  enabled: false
createUserJob:
  enabled: false
  useHelmHooks: false
migrateDatabaseJob:
  enabled: true
  # Not a Helm hook: under Flux (--wait) and Argo (PostSync after healthy) a
  # post-install hook would wait for pods that wait for the migrations.
  useHelmHooks: false
  # A plain Job with ttlSecondsAfterFinished disappears after it succeeds:
  # Argo would see the release out of sync and recreate it forever. Argo runs
  # it as a Sync hook instead (recreated on every sync, migrations are
  # idempotent); Helm and Flux ignore these annotations.
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 200m
config:
  core:
    load_examples: 'False'
    auth_manager: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
  fab:
    enable_proxy_fix: "True"
    cookie_secure: "True"
    cookie_samesite: "Lax"
