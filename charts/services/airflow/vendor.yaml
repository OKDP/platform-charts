# Upstream charts rendered by okdp.vendor.render (the former KuboCD modules).
# vendor/ is downloaded, not committed: scripts/vendor-charts.sh charts/services/airflow
charts:
  - name: airflow             # module main
    repository: https://airflow.apache.org
    version: 1.22.0
    # Bundled application subchart, disabled (postgresql.enabled: false):
    # okdp.vendor.render refuses to carry it.
    drop: [charts/postgresql]
  - name: oidc-dcr            # module oidc-dcr (global.okdp.oidc.clientProvisioning: dcr)
    repository: oci://quay.io/adaltas
    version: 0.3.3
