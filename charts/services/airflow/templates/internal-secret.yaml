{{- /*
Former module internal-secrets (a StringSecret) plus the Fernet key the
upstream chart minted in a pre-install hook with randAlphaNum: generated once
by ESO. fernet-key is the base64 of 32 characters, the format the chart used.
Argo applies it one wave before the migration Sync hook, which reads it: a
failed apply (ESO webhook not serving yet) then fails the operation before the
hook starts, and the retry converges. Flux and Helm ignore the annotation.
Kept when the release goes away (Helm keep, Argo CD Delete=false) and adopted
again by the next install: the database outlives the release and its
connections and variables are encrypted with fernet-key.
*/}}
{{ include "okdp.generatedSecretExt" (dict "ctx" . "name" (include "okdp-airflow.internalSecret" .)
     "keys" (list
       (dict "key" "api-secret-key" "length" 32)
       (dict "key" "jwt-secret" "length" 64)
       (dict "key" "fernet-key" "length" 32 "transform" "b64enc"))
     "annotations" (dict "argocd.argoproj.io/sync-wave" "-1" "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-options" "Delete=false")) }}
