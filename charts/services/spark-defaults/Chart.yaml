apiVersion: v2
name: spark-defaults
description: >-
  Spark default properties (spark-defaults.conf) for the Spark jobs of a namespace.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 1.0.0-1.0.0
appVersion: "1.0.0"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/OKDP/okdp-sandbox
annotations:
  # Former KuboCD package roles, kept for the catalog.
  okdp.io/roles: spark-defaults
dependencies:
  - name: okdp-lib
    version: 0.1.0
    # TODO(no-kubocd): switch to oci://quay.io/okdp/platform-charts
    repository: file://../../../../okdp-lib
  # The former module main: its values were static (empty), so it stays a
  # plain Helm dependency (values slot `spark-defaults`, no alias: an alias
  # would rename the upstream labels).
  - name: spark-defaults
    version: 1.0.0
    repository: oci://quay.io/okdp/charts
