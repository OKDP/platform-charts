apiVersion: v2
name: okdp-control-plane-ui
description: >-
  OKDP UI - Frontend web interface for the Open Kubernetes Data Platform.
type: application
# <upstream>-<okdp semver>; the okdp half is owned by release-please.
version: 0.9.0-1.0.0
appVersion: "0.9.0"
home: https://okdp.io
maintainers:
  - name: Pierre Sauvage
    email: m.sauvage.pierre@gmail.com
    url: https://github.com/Pierrotws
sources:
  - https://github.com/OKDP/platform-charts
  - https://github.com/OKDP/okdp-control-plane-ui
annotations:
  # Former KuboCD package roles/dependencies, kept for the catalog.
  okdp.io/roles: okdp-ui
  okdp.io/depends-on: okdp-server,ingress
dependencies:
  - name: okdp-lib-chart
    version: ">=0.2.0 <1.0.0"
    repository: oci://quay.io/okdp/charts
