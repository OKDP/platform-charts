{{- /*
The server reaches the cluster through its ServiceAccount. A ClusterRole:
project namespaces are created at run time. The desired state is in Git: the
server never writes HelmReleases, Applications or workloads, it only reads
them (observed state). Mirrors okdp-control-plane-server chart/templates/rbac.yaml.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "okdp.fullname" . }}
  labels:
    {{- include "okdp.labels" . | nindent 4 }}
rules:
  # --- Observed state, read-only -------------------------------------------
  # ConfigMaps: the instance descriptors (<release>-okdp, label okdp.io/instance)
  # in the project namespaces, and the platform values
  # (<gitops.releasesNamespace>/okdp-platform-values).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Workloads of the instances (label app.kubernetes.io/instance), and the
  # Warning events explaining one that is not Ready.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # GitOps engine objects: the render/sync status of each release. The engine
  # makes them from Git.
  {{- if eq .Values.gitops.engine "argocd" }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  {{- else }}
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Resource usage panels (metrics-server).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The SparkApplication form reads the operator's CRD schema.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # --- Written by the server itself ----------------------------------------
  # Projects are namespaces labelled okdp.io/project (description in the
  # okdp.io/description annotation).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Connection credentials Secrets (and the SecretStore ones).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Pods and logs (service inspection); a deleted instance's per-user pods and
  # volumes (JupyterHub homes) are reclaimed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # Secret management (External Secrets Operator).
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Spark workloads submitted from the console.
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "okdp.fullname" . }}
  labels:
    {{- include "okdp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "okdp.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "okdp.fullname" . }}
